# CI for the QA platform's own repository.
# This validates the platform source itself; it is NOT the future
# CI/CD product feature (CICDPlan domain).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Verifier trust tests execute real replay inside systemd user
      # services (§7). Non-interactive sessions have no user bus unless
      # the runner user lingers, so provision it like any other test
      # prerequisite (cf. socat for the Phase 4 Claude sandbox tests).
      # The bus check is informational; the trust tests assert sandbox
      # availability themselves and report the preflight reason on failure.
      - name: Enable systemd user lingering for sandbox tests
        run: |
          sudo loginctl enable-linger "$USER"
          systemctl --user is-system-running || true
      - name: Probe user-unit mount capabilities (temporary CI debug)
        run: |
          probe_dir=$(mktemp -d /var/tmp/sentry-ci-probe.XXXXXX)
          echo "probe dir: $probe_dir"
          probe() {
            label=$1
            shift
            if output=$("$@" 2>&1); then status=0; else status=$?; fi
            printf '%s\n' "$output" | tail -6
            printf '%s_exit=%s\n' "$label" "$status"
          }
          probe bare systemd-run --user --wait --pipe --collect --unit=ci-probe-bare -- /usr/bin/true
          probe staged systemd-run --user --wait --pipe --collect --unit=ci-probe-staged \
            -p TemporaryFileSystem=/ -p ProtectHome=yes -p PrivateNetwork=yes \
            -p NoNewPrivileges=yes -p KillMode=control-group -p TimeoutStopSec=5s \
            -p ProtectControlGroups=yes -p ProtectKernelTunables=yes \
            -p ProtectKernelModules=yes -p RestrictSUIDSGID=yes \
            -p ReadWritePaths="$probe_dir" -p BindPaths="$probe_dir" \
            -p BindReadOnlyPaths=/usr/bin -p BindReadOnlyPaths=/usr/lib \
            -p BindReadOnlyPaths=/usr/share -p BindReadOnlyPaths=/bin \
            -p BindReadOnlyPaths=/lib -p BindReadOnlyPaths=/lib64 \
            -p WorkingDirectory="$probe_dir" -- /usr/bin/test -d "$probe_dir"
          rmdir "$probe_dir"

      - run: pnpm repository:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
