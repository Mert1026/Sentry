# CI for the QA platform's own repository.
# This validates the platform source itself; it is NOT the future
# CI/CD product feature (CICDPlan domain).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Verifier trust tests execute real replay inside systemd user
      # services (§7). Non-interactive sessions have no user bus unless
      # the runner user lingers, so provision it like any other test
      # prerequisite (cf. socat for the Phase 4 Claude sandbox tests).
      # The bus check is informational; the trust tests assert sandbox
      # availability themselves and report the preflight reason on failure.
      - name: Enable systemd user lingering for sandbox tests
        run: |
          sudo loginctl enable-linger "$USER"
          systemctl --user is-system-running || true
      - name: Probe user-unit mount capabilities (temporary CI debug)
        run: |
          D=$(mktemp -d)
          echo "probe dir: $D"
          systemd-run --user --wait --pipe --collect --unit=ci-probe-bare -- /usr/bin/true 2>&1 | tail -2; echo "bare_exit=$?"
          systemd-run --user --wait --pipe --collect --unit=ci-probe-tfs -p TemporaryFileSystem=/:ro -- /usr/bin/true 2>&1 | tail -2; echo "tfs_exit=$?"
          systemd-run --user --wait --pipe --collect --unit=ci-probe-bind -p BindPaths="$D" -p WorkingDirectory="$D" -- /usr/bin/test -d "$D" 2>&1 | tail -2; echo "bind_exit=$?"
          systemd-run --user --wait --pipe --collect --unit=ci-probe-tfsbind -p TemporaryFileSystem=/ -p BindPaths="$D" -p WorkingDirectory="$D" -- /usr/bin/test -d "$D" 2>&1 | tail -2; echo "tfsbind_exit=$?"
          systemd-run --user --wait --pipe --collect --unit=ci-probe-protect -p ProtectSystem=strict -p ProtectHome=yes -p ReadWritePaths="$D" -p WorkingDirectory="$D" -- /usr/bin/test -d "$D" 2>&1 | tail -2; echo "protect_exit=$?"
          rm -rf "$D"

      - run: pnpm repository:check
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
