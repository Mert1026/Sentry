name: distribution (Windows unsigned review candidate)
on:
  pull_request:
  push:
    branches: [dev, release/v1.0.0-windows]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  attestations: write
jobs:
  archive:
    name: Windows release archive
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm distribution:test
      - name: Windows maintenance and parser fixtures
        shell: powershell
        run: |
          powershell -NoProfile -File scripts/distribution/tests/maintenance.test.ps1
          $files = Get-ChildItem scripts/distribution/*.ps1
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw "syntax errors in $f" }
          }
      - name: Build and extract unsigned candidate (never publish)
        run: pnpm distribution:build windows-x64
      # The setup wizard wraps exactly the extracted, verified archive above.
      - name: Build the setup wizard (SentrySetup.exe)
        shell: powershell
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup could not be installed' }
          pnpm distribution:installer
      # Proves which workflow built the ZIP and the setup wizard, so `sentry update` can check the publisher with `gh attestation verify`.
      - uses: actions/attest-build-provenance@v2
        if: github.event_name != 'pull_request'
        with:
          subject-path: |
            dist/distributions/*.zip
            dist/distributions/*.exe
      # Private workflow artifacts are review candidates, not GitHub Releases.
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-review-windows-x64-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/distributions/*.zip
            dist/distributions/*.exe
            dist/distributions/*.sha256
          if-no-files-found: error
          retention-days: 7
