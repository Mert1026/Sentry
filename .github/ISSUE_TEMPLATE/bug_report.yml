name: Bug report
description: Report a Sentry problem (no secrets, ever).
title: '[bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: '## ⚠️ Do not paste API keys, provider tokens, or secrets. `sentry doctor` never prints them — keep it that way here too.'
  - type: input
    id: version
    attributes:
      label: Sentry version
      description: Output of `sentry version`.
      placeholder: '1.0.0-rc.1'
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Full source SHA from build identity or `sentry version`.
      placeholder: '40-character source SHA'
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Host operating system and version
      placeholder: 'Windows 11 or native CachyOS (include version/kernel)'
    validations:
      required: true
  - type: input
    id: wsl
    attributes:
      label: WSL distro
      description: From `sentry status` (e.g. Ubuntu, WSL2); use N/A on native CachyOS.
      placeholder: 'Ubuntu (WSL2)'
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: What command failed
      placeholder: 'sentry setup'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: sentry status output
      description: Paste `sentry status -Json` (Windows) or `sentry status --json` (CachyOS).
      render: json
    validations:
      required: false
  - type: textarea
    id: doctor
    attributes:
      label: Relevant sentry doctor FAIL/WARN lines
      render: text
    validations:
      required: false
