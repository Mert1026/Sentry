<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;background:#050806;font-family:"Segoe UI",Inter,Arial,sans-serif;color:#fff;position:relative}
.glow{position:absolute;inset:0;background:
 radial-gradient(ellipse 700px 420px at 50% 100%,rgba(107,190,110,.7),transparent 70%),
 radial-gradient(ellipse 600px 500px at 100% 55%,rgba(60,140,80,.35),transparent 70%),
 radial-gradient(ellipse 500px 400px at 0% 40%,rgba(40,100,60,.25),transparent 70%)}
.logo{position:absolute;top:70px;left:50%;transform:translateX(-50%);height:190px}
.brand{position:absolute;top:290px;width:100%;text-align:center;font-size:30px;letter-spacing:14px;color:#cfe8cf;display:flex;justify-content:center;align-items:center;gap:26px}
.brand i{display:block;width:90px;height:2px;background:#3d5c44}
h1{position:absolute;top:345px;width:100%;text-align:center;font-size:84px;line-height:1.08;font-weight:800;letter-spacing:-2px}
h1 span{color:#a8dcaa}
.sub{position:absolute;top:570px;width:100%;text-align:center;font-size:30px;color:#9db8a2;letter-spacing:.5px}
.laptop{position:absolute;left:90px;top:700px;width:900px}
.screen{background:#0b0f0c;border:10px solid #1b1f1c;border-radius:22px 22px 0 0;overflow:hidden;height:514px}
.screen img{width:100%;display:block;object-position:top left}
.base{height:26px;background:linear-gradient(#cfd3d0,#7c817e);border-radius:0 0 40px 40px;margin:0 -50px;box-shadow:0 30px 80px rgba(120,220,130,.45)}
.fade{position:absolute;left:0;right:0;bottom:0;height:140px;background:linear-gradient(transparent,#050806 85%)}
.tags{position:absolute;bottom:42px;width:100%;text-align:center;font-size:26px;letter-spacing:8px;color:#a8dcaa;font-weight:600}
</style></head><body>
<div class="glow"></div>
<img class="logo" src="logo.png">
<div class="brand"><i></i>SENTRY<i></i></div>
<h1>Many agents. One run.<br><span>Every bug found.</span></h1>
<div class="sub">AI QA agents test your project in parallel.</div>
<div class="laptop"><div class="screen"><img src="ui.png"></div><div class="base"></div></div>
<div class="fade"></div>
<div class="tags">EVERY BUG. EVERY TIME.</div>
</body></html>
